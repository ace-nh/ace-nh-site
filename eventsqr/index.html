<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex" />
  <!--
    Permanent target of the printed ACE events QR code.
    To point the QR code at a different event, change CURRENT_EVENT below
    (and the matching meta refresh + fallback link).
  -->
  <meta http-equiv="refresh" content="0; url=/events/2026-fundraiser-breakfast/" />
  <title>ACE Mentor Program of NH</title>
  <script>
    var CURRENT_EVENT = '/events/2026-fundraiser-breakfast/';
    // Keep any ?src= tag from the QR link.
    location.replace(CURRENT_EVENT + location.search);
  </script>
</head>
<body style="font-family: sans-serif; text-align: center; padding: 40px 16px;">
  <p><a href="/events/2026-fundraiser-breakfast/">Continue to the ACE NH event page &rarr;</a></p>
</body>
</html>
